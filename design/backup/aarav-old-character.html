<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Backup: old Aarav character (flat SVG)</title>
<!--
  BACKUP of the flat, hand-drawn Aarav from the intro's desk scene
  (index.html, inside <figure class="mind">), replaced on 18 Oct 2026 by the
  painted cutouts src/assets/images/aarav-worried.* and aarav-calm.*.

  To bring him back:
    1. In index.html, replace the <g class="mind__aarav"> block (and its
       comment) with the <g class="mind__person"> block below. Put it AFTER the
       desk line (<path class="mind__wood" d="M18 320…">), as it was. The chair
       is the first path in the group, so delete the separate
       <path class="mind__chair"> that sits before the cutout.
    2. In src/styles/home.css, replace the "Aarav, painted" rules
       (.mind__face…) with the CSS below.
  Open this file in a browser to see him on his own.
-->
<style>
  :root { --bg: #F3E6DA; --fg: #3A2E2A; --accent: #D99A7A; --midday-bg: #E2F0EE; --midday-accent: #3F8D89; --ease-out: cubic-bezier(0.22, 1, 0.36, 1); }
  body { margin: 2rem; background: var(--bg); }
  .mind__ink { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mind__ink--thin { stroke-width: 1.3; }
  .mind__chair { fill: none; stroke: color-mix(in srgb, var(--fg) 75%, var(--bg)); stroke-width: 3.5; stroke-linecap: round; }

.mind__skin {
  fill: color-mix(in srgb, color-mix(in srgb, var(--accent) 70%, var(--fg)) 70%, var(--bg));
}

.mind__shirt {
  fill: color-mix(in srgb, var(--midday-accent) 22%, var(--midday-bg));
}

.mind__hair {
  fill: color-mix(in srgb, var(--fg) 92%, var(--bg));
}

/* Arms are two strokes on one path: an outline, then the fill on top. */
.mind__limb-line,
.mind__limb {
  fill: none;
  stroke-linecap: round;
}

.mind__limb-line {
  stroke: var(--fg);
}

.mind__limb--shirt {
  stroke: color-mix(in srgb, var(--midday-accent) 22%, var(--midday-bg));
}

.mind__limb--skin {
  stroke: color-mix(in srgb, color-mix(in srgb, var(--accent) 70%, var(--fg)) 70%, var(--bg));
}


.mind__mouth {
  fill: none;
  stroke: var(--fg);
  stroke-width: 2;
  stroke-linecap: round;
  transition: opacity 0.9s var(--ease-out);
}

.mind__mouth--smile {
  opacity: 0;
}

/* "What people see": he smiles. */
.mind:has(input[value="outside"]:checked) .mind__mouth--still {
  opacity: 0;
}

.mind:has(input[value="outside"]:checked) .mind__mouth--smile {
  opacity: 1;
}

.mind__skin,
.mind__shirt,
.mind__hair {
  stroke: var(--fg);
  stroke-width: 2;
  stroke-linejoin: round;
}

</style>
</head>
