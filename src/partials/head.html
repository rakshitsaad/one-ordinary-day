    <!-- Moving between pages: a soft cross-fade. Browsers with cross-document
         View Transitions (Chrome, Edge, Safari 18.2+) do it themselves; the
         rest get a short fade through the page colour (src/scripts/page-transition.js
         fades out; this arriving half is inline so it's there on the first paint,
         and its own timers always reveal the page). None with reduced motion. -->
    <style>
      @view-transition { navigation: auto; }
      ::view-transition-old(root),
      ::view-transition-new(root) { animation-duration: 0.35s; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      @media (prefers-reduced-motion: reduce) {
        @view-transition { navigation: none; }
      }
      html[data-arriving]::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: var(--arrive-bg);
        pointer-events: none;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      html.is-arrived::after {
        opacity: 0;
      }
    </style>
    <script>
      try {
        var fade = sessionStorage.getItem("ood-page-fade");
        sessionStorage.removeItem("ood-page-fade");
        if (fade && !("PageRevealEvent" in window) && /^(rgb|color)\([\w\s.,%/-]*\)$/.test(fade) && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          var root = document.documentElement;
          root.setAttribute("data-arriving", "");
          root.style.setProperty("--arrive-bg", fade);
          setTimeout(function () { root.classList.add("is-arrived"); }, 1200);
          setTimeout(function () { root.removeAttribute("data-arriving"); }, 2000);
        }
      } catch (e) {}
    </script>
